# Workflow descartável: remove a si próprio após sincronizar os tipos.
name: Sync Option B database types

on:
  push:
    branches:
      - feat/internal-mx-option-b-global-admin

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Generate production types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            | grep -v '^Initialising login role' \
            | grep -v '^A new version of Supabase CLI' \
            | grep -v '^We recommend updating regularly' \
            > /tmp/db_remote.ts

          {
            echo '// AUTO-GENERATED by `npm run gen:db-types` — DO NOT EDIT MANUALLY.'
            echo '// Source: Supabase project fbhcmzzgwjdgkctlfvbo (MX GESTAO PREDITIVA)'
            echo '// Regenerate after every migration: `npm run gen:db-types`'
            echo '// CI gate: .github/workflows/db-types-diff.yml bloqueia merge se houver drift.'
            echo
            cat /tmp/db_remote.ts
          } > src/types/database.generated.ts

          rm .github/workflows/sync-option-b-db-types.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.generated.ts .github/workflows/sync-option-b-db-types.yml
          git commit -m 'chore(db): sync Option B production types'
          git push origin HEAD:feat/internal-mx-option-b-global-admin
