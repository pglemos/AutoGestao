name: Apply Store Edit Management Lock

on:
  push:
    branches:
      - feature/owner-manager-context
    paths:
      - scripts/apply_store_edit_management_lock.py
      - .github/workflows/apply-store-edit-management-lock.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-manager-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply store management edit lock
        run: python scripts/apply_store_edit_management_lock.py
      - name: Validate diff
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/StoreEditModal.tsx
          git commit -m "fix: lock active manager state in store editing"
          git push origin HEAD:feature/owner-manager-context
