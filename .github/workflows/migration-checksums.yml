name: Migration Checksums (forward-only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/gen_migration_checksums.mjs'
      - 'scripts/check_migration_checksum_drift.mjs'
      - '.github/workflows/migration-checksums.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksums:
    name: Migration checksum drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar integridade do manifest de migrations
        run: node scripts/gen_migration_checksums.mjs --check

      - name: Verificar drift contra a base do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check_migration_checksum_drift.mjs --base "$BASE_SHA"
