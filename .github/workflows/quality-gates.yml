name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.test-signature
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: npm ci

      - name: Production hardening contracts
        run: bun test src/test/production-hardening-contract.test.ts

      - name: Deterministic engine contracts
        run: bun test src/lib/deterministic-actions.test.ts src/lib/deterministic-actions-hardening.test.ts

      - name: Deterministic data adapter contracts
        run: bun test src/features/deterministic-actions/deterministic-action-data.test.ts

      - name: Typecheck diagnostics
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-${{ github.run_id }}
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Page tests
        shell: bash
        run: |
          set -o pipefail
          bun test --isolate --max-concurrency=1 src/pages 2>&1 | tee page-tests.log

      - name: Upload page test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-tests-${{ github.run_id }}
          path: page-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Feature tests
        run: bun test --isolate --max-concurrency=1 src/features

      - name: Cross-cutting test contracts
        run: bun test --isolate --max-concurrency=1 src/test

      - name: Unit and integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
