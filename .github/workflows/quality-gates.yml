name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: npm ci

      - name: Production hardening contracts
        run: bun test src/test/production-hardening-contract.test.ts

      - name: Deterministic engine contracts
        run: bun test src/lib/deterministic-actions.test.ts src/lib/deterministic-actions-hardening.test.ts

      - name: Deterministic data adapter contracts
        run: bun test src/features/deterministic-actions/deterministic-action-data.test.ts

      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-tests.log

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ github.run_id }}
          path: unit-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
