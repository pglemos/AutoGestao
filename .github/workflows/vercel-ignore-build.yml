name: vercel-ignore-build

on:
  pull_request:
    paths:
      - 'scripts/vercel-ignore-build.mjs'
      - 'scripts/vercel-ignore-build.test.mjs'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run vercel-ignore-build tests
        run: node --test scripts/vercel-ignore-build.test.mjs
