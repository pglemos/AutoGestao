name: Fix legacy migration and sync contracts

on:
  push:
    branches:
      - feat/internal-mx-option-b-global-admin
    paths:
      - '.github/workflows/fix-legacy-migration-and-sync.yml'

permissions:
  contents: write

jobs:
  repair-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/internal-mx-option-b-global-admin
          fetch-depth: 0

      - name: Repair recovered migration separators
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/migrations/20260723143000_carteira_categoria_veiculo.sql')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('BEGIN\n\nDO $$', 'BEGIN;\n\nDO $$'),
              ('END $$\n\nALTER TABLE public.oportunidades', 'END $$;\n\nALTER TABLE public.oportunidades'),
              ('ADD COLUMN IF NOT EXISTS categoria_veiculo public.crm_categoria_veiculo\n\nALTER TABLE public.veiculos_estoque', 'ADD COLUMN IF NOT EXISTS categoria_veiculo public.crm_categoria_veiculo;\n\nALTER TABLE public.veiculos_estoque'),
              ('ADD COLUMN IF NOT EXISTS categoria public.crm_categoria_veiculo\n\nCOMMENT ON COLUMN public.oportunidades', 'ADD COLUMN IF NOT EXISTS categoria public.crm_categoria_veiculo;\n\nCOMMENT ON COLUMN public.oportunidades'),
              ("'Categoria do veiculo de interesse do cliente, para sugestao de veiculos chegados por categoria.'\n\nCOMMENT ON COLUMN public.veiculos_estoque", "'Categoria do veiculo de interesse do cliente, para sugestao de veiculos chegados por categoria.';\n\nCOMMENT ON COLUMN public.veiculos_estoque"),
              ("'Categoria do veiculo recem-chegado, para sugestao aos clientes da carteira.'\n\nCREATE OR REPLACE FUNCTION", "'Categoria do veiculo recem-chegado, para sugestao aos clientes da carteira.';\n\nCREATE OR REPLACE FUNCTION"),
              ('$function$\n\nNOTIFY pgrst', '$function$;\n\nNOTIFY pgrst'),
              ("NOTIFY pgrst, 'reload schema'\n\nCOMMIT", "NOTIFY pgrst, 'reload schema';\n\nCOMMIT"),
              ('COMMIT\n\n-- DOWN (manual):', 'COMMIT;\n\n-- DOWN (manual):'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Regenerate migration checksum manifest
        run: node scripts/gen_migration_checksums.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Generate database types from production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            | grep -v '^Initialising login role' \
            | grep -v '^A new version of Supabase CLI' \
            | grep -v '^We recommend updating regularly' \
            > /tmp/db_remote.ts
          cat > src/types/database.generated.ts <<'HEADER'
          // AUTO-GENERATED by `npm run gen:db-types` — DO NOT EDIT MANUALLY.
          // Source: Supabase project fbhcmzzgwjdgkctlfvbo (MX GESTAO PREDITIVA)
          // Regenerate after every migration: `npm run gen:db-types`
          // CI gate: .github/workflows/db-types-diff.yml bloqueia merge se houver drift.

          HEADER
          cat /tmp/db_remote.ts >> src/types/database.generated.ts

      - name: Validate repaired SQL markers
        run: |
          grep -q '^BEGIN;$' supabase/migrations/20260723143000_carteira_categoria_veiculo.sql
          grep -q '^END \$\$;$' supabase/migrations/20260723143000_carteira_categoria_veiculo.sql
          grep -q '^\$function\$;$' supabase/migrations/20260723143000_carteira_categoria_veiculo.sql
          grep -q "^NOTIFY pgrst, 'reload schema';$" supabase/migrations/20260723143000_carteira_categoria_veiculo.sql
          grep -q '^COMMIT;$' supabase/migrations/20260723143000_carteira_categoria_veiculo.sql

      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'pglemos'
          git config user.email '186871945+pglemos@users.noreply.github.com'
          git rm .github/workflows/fix-legacy-migration-and-sync.yml
          git add supabase/migrations/20260723143000_carteira_categoria_veiculo.sql
          git add supabase/migrations/.migration-checksums.json
          git add src/types/database.generated.ts
          git diff --cached --check
          git commit -m 'fix(db): repair recovered migration and sync contracts'
          git push origin HEAD:feat/internal-mx-option-b-global-admin
