name: Sync PR 153 generated database types (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/feat/internal-mx-option-b-global-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Generate types from linked project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            | grep -v '^Initialising login role' \
            | grep -v '^A new version of Supabase CLI' \
            | grep -v '^We recommend updating regularly' \
            > /tmp/db_remote.ts
          {
            printf '%s\n' \
              '// AUTO-GENERATED by `npm run gen:db-types` — DO NOT EDIT MANUALLY.' \
              '// Source: Supabase project fbhcmzzgwjdgkctlfvbo (MX GESTAO PREDITIVA)' \
              '// Regenerate after every migration: `npm run gen:db-types`' \
              '// CI gate: .github/workflows/db-types-diff.yml bloqueia merge se houver drift.' \
              ''
            cat /tmp/db_remote.ts
          } > src/types/database.generated.ts

      - name: Commit generated types and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.generated.ts .github/workflows/sync-pr153-generated-types-once.yml
          git rm .github/workflows/sync-pr153-generated-types-once.yml
          git commit -m 'chore(db): sync generated types for internal MX admin RPCs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
