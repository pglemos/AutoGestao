name: Freeze complete migration manifest

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/freeze-all-migrations.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/internal-mx-option-b-global-admin
          fetch-depth: 0

      - name: Regenerate complete migration manifest
        run: node scripts/gen_migration_checksums.mjs

      - name: Validate complete coverage
        shell: bash
        run: |
          file_count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          manifest_count=$(node -e "const data=require('./supabase/migrations/.migration-checksums.json'); process.stdout.write(String(data.count))")
          test "$file_count" = "$manifest_count"
          node scripts/gen_migration_checksums.mjs --check

      - name: Remove temporary workflow and commit manifest
        run: |
          git config user.name 'pglemos'
          git config user.email '186871945+pglemos@users.noreply.github.com'
          git rm .github/workflows/freeze-all-migrations.yml
          git add supabase/migrations/.migration-checksums.json
          git diff --cached --check
          git commit -m 'chore(db): freeze complete migration manifest'
          git push origin HEAD:feat/internal-mx-option-b-global-admin
