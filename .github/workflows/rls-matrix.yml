name: RLS Regression Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/rls-matrix/**'
      - 'scripts/run_rls_matrix.sh'
      - '.github/workflows/rls-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-matrix:
    name: pgTAP RLS Matrix (8x5=40 cenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        id: supabase-start
        shell: bash
        run: |
          set +e
          supabase start --debug > /tmp/supabase-start.log 2>&1
          status=$?
          tail -300 /tmp/supabase-start.log
          exit "$status"

      - name: Upload Supabase startup diagnostics
        if: failure() && steps.supabase-start.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-diagnostics
          path: /tmp/supabase-start.log
          if-no-files-found: error
          retention-days: 2

      - name: Capture migration history after startup
        env:
          PGPASSWORD: postgres
        run: |
          expected=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          actual=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "SELECT count(*) FROM supabase_migrations.schema_migrations")
          echo "Migration history after startup: $actual/$expected"
          test "$actual" = "$expected"
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/migration-history-before.txt

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Verify migration history after reset
        env:
          PGPASSWORD: postgres
        run: |
          expected=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          actual=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "SELECT count(*) FROM supabase_migrations.schema_migrations")
          echo "Migration history after reset: $actual/$expected"
          test "$actual" = "$expected"
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/migration-history-after.txt
          diff -u /tmp/migration-history-before.txt /tmp/migration-history-after.txt

      - name: Install pgTAP extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Run RLS Matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/run_rls_matrix.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
