name: Option B diagnostics

on:
  push:
    branches:
      - feat/internal-mx-option-b-global-admin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Collect unit-test diagnostics
        shell: bash
        run: |
          set +e
          bun test > /tmp/unit-tests.log 2>&1
          echo $? > /tmp/unit-tests.status
          tail -200 /tmp/unit-tests.log
          exit 0

      - name: Collect migration-checksum diagnostics
        shell: bash
        run: |
          set +e
          node scripts/gen_migration_checksums.mjs --check > /tmp/migration-checksums.log 2>&1
          echo $? > /tmp/migration-checksums.status
          cat /tmp/migration-checksums.log
          exit 0

      - name: Collect bundle diagnostics
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          echo $? > /tmp/build.status
          npm run check:bundle-size > /tmp/bundle-budget.log 2>&1
          echo $? > /tmp/bundle-budget.status
          cat /tmp/bundle-budget.log
          exit 0

      - name: Generate database types and diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            | grep -v '^Initialising login role' \
            | grep -v '^A new version of Supabase CLI' \
            | grep -v '^We recommend updating regularly' \
            > /tmp/db_remote.ts
          echo $? > /tmp/db-types-generate.status
          tail -n +6 src/types/database.generated.ts > /tmp/db_local.ts
          diff -u /tmp/db_local.ts /tmp/db_remote.ts > /tmp/db-types.diff
          echo $? > /tmp/db-types-diff.status
          head -250 /tmp/db-types.diff
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: option-b-diagnostics
          path: |
            /tmp/*.log
            /tmp/*.status
            /tmp/db_remote.ts
            /tmp/db_local.ts
            /tmp/db-types.diff
          if-no-files-found: error
          retention-days: 2
