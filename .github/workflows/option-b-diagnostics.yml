name: Option B diagnostics

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/internal-mx-option-b-global-admin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Collect unit-test diagnostics
        shell: bash
        run: |
          set +e
          bun test > /tmp/unit-tests.log 2>&1
          echo $? > /tmp/unit-tests.status
          tail -200 /tmp/unit-tests.log
          exit 0

      - name: Collect migration-checksum diagnostics
        shell: bash
        run: |
          set +e
          node scripts/gen_migration_checksums.mjs --check > /tmp/migration-checksums.log 2>&1
          echo $? > /tmp/migration-checksums.status
          cat /tmp/migration-checksums.log
          exit 0

      - name: Collect branch bundle diagnostics
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          echo $? > /tmp/build.status
          npm run check:bundle-size > /tmp/bundle-budget.log 2>&1
          echo $? > /tmp/bundle-budget.status
          cat /tmp/bundle-budget.log
          exit 0

      - name: Compare main bundle baseline
        shell: bash
        run: |
          set +e
          git worktree add /tmp/mx-base origin/main > /tmp/base-worktree.log 2>&1
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/mx-base/node_modules
          (
            cd /tmp/mx-base
            npm run build > /tmp/base-build.log 2>&1
            echo $? > /tmp/base-build.status
            npm run check:bundle-size > /tmp/base-bundle-budget.log 2>&1
            echo $? > /tmp/base-bundle-budget.status
          )
          cat /tmp/base-bundle-budget.log
          exit 0

      - name: Generate database types and diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            | grep -v '^Initialising login role' \
            | grep -v '^A new version of Supabase CLI' \
            | grep -v '^We recommend updating regularly' \
            > /tmp/db_remote.ts
          echo $? > /tmp/db-types-generate.status
          tail -n +6 src/types/database.generated.ts > /tmp/db_local.ts
          diff -u /tmp/db_local.ts /tmp/db_remote.ts > /tmp/db-types.diff
          echo $? > /tmp/db-types-diff.status
          head -250 /tmp/db-types.diff
          exit 0

      - name: Sync generated types and repair legacy checksum manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '// AUTO-GENERATED by `npm run gen:db-types` — DO NOT EDIT MANUALLY.'
            echo '// Source: Supabase project fbhcmzzgwjdgkctlfvbo (MX GESTAO PREDITIVA)'
            echo '// Regenerate after every migration: `npm run gen:db-types`'
            echo '// CI gate: .github/workflows/db-types-diff.yml bloqueia merge se houver drift.'
            echo
            cat /tmp/db_remote.ts
          } > src/types/database.generated.ts

          node <<'NODE'
          const fs = require('node:fs')
          const path = 'supabase/migrations/.migration-checksums.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          delete manifest.checksums['20260520120000_gemini_daily_usage_limits.sql']
          manifest.count = Object.keys(manifest.checksums).length
          manifest.generated_at = '2026-07-27'
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          NODE

          if git diff --quiet -- src/types/database.generated.ts supabase/migrations/.migration-checksums.json; then
            echo 'Generated contracts already synchronized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.generated.ts supabase/migrations/.migration-checksums.json
          git commit -m 'chore(db): sync generated types and repair checksum manifest'
          git push origin HEAD:feat/internal-mx-option-b-global-admin

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: option-b-diagnostics
          path: |
            /tmp/*.log
            /tmp/*.status
            /tmp/db_remote.ts
            /tmp/db_local.ts
            /tmp/db-types.diff
          if-no-files-found: error
          retention-days: 2
